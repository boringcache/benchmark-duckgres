workspace = "boringcache/benchmark-duckgres"

[adapters.docker]
tag = "duckgres-docker-local"
metadata-hints = ["benchmark=duckgres", "upstream-job=build-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--platform", "linux/amd64",
  "--build-arg", "VERSION=build-__SOURCE_SHA__",
  "--build-arg", "COMMIT=__SOURCE_SHA__",
  "--build-arg", "BUILD_TAGS=kubernetes",
  "--tag", "duckgres-benchmark:local",
  "upstream",
]
