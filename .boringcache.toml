workspace = "boringcache/benchmark-duckgres"

[adapters.docker]
tag = "duckgres-docker-local"
metadata-hints = ["benchmark=duckgres", "upstream-job=build-amd64"]
command = [
  "bash", "-euo", "pipefail", "-c",
  "source_sha=$(git -C upstream rev-parse HEAD); exec docker buildx build --file upstream/Dockerfile --platform linux/amd64 --build-arg VERSION=build-${source_sha} --build-arg COMMIT=${source_sha} --build-arg BUILD_TAGS=kubernetes --tag duckgres-benchmark:local upstream",
]
